<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff8ef">
  <title>今天吃什麼？｜美食抽籤器</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #32271f;
      --muted: #81756b;
      --accent: #e76d45;
      --accent-dark: #c65130;
      --paper: #fffdf9;
      --line: #eadfd3;
      --soft: #fff4e8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 12%, #ffe8d1 0, transparent 34%),
        radial-gradient(ellipse at 90% 88%, #f9dfd4 0, transparent 32%),
        #fff8ef;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    .card {
      width: min(100%, 560px);
      overflow: hidden;
      border: 1px solid rgba(234, 223, 211, .9);
      border-radius: 28px;
      background: var(--paper);
      box-shadow: 0 24px 70px rgba(100, 65, 39, .13);
    }

    header {
      padding: 38px 36px 26px;
      text-align: center;
      background: linear-gradient(145deg, #fff4e8, #fffaf4 72%);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 12px;
      padding: 7px 12px;
      border-radius: 999px;
      color: var(--accent-dark);
      background: #ffe8d8;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    h1 { margin: 0; font-size: clamp(30px, 7vw, 42px); letter-spacing: .04em; }
    .subtitle { margin: 10px 0 0; color: var(--muted); font-size: 15px; }
    main { padding: 28px 36px 36px; }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: 800;
    }

    .hint { margin: -4px 0 12px; color: var(--muted); font-size: 13px; }

    textarea {
      display: block;
      width: 100%;
      min-height: 150px;
      resize: vertical;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      color: var(--ink);
      background: #fff;
      font: inherit;
      font-size: 16px;
      line-height: 1.8;
      transition: border-color .2s, box-shadow .2s;
    }

    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(231, 109, 69, .13); }

    button {
      width: 100%;
      min-height: 54px;
      margin-top: 18px;
      border: 0;
      border-radius: 14px;
      color: white;
      background: var(--accent);
      box-shadow: 0 8px 18px rgba(231, 109, 69, .23);
      font: inherit;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s, background .15s, box-shadow .15s;
    }

    button:hover { transform: translateY(-2px); background: var(--accent-dark); box-shadow: 0 11px 22px rgba(198, 81, 48, .25); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid #f3b99e; outline-offset: 3px; }

    .result {
      min-height: 126px;
      display: grid;
      place-items: center;
      margin-top: 22px;
      padding: 20px;
      border: 1px dashed #edcdbb;
      border-radius: 16px;
      text-align: center;
      background: var(--soft);
    }

    .result-label { margin: 0 0 7px; color: var(--muted); font-size: 13px; font-weight: 700; }
    .result-value { margin: 0; color: var(--accent-dark); font-size: clamp(26px, 7vw, 36px); font-weight: 900; overflow-wrap: anywhere; }
    .result-value.placeholder { color: #8d8177; font-size: 16px; font-weight: 600; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @media (max-width: 480px) {
      header { padding: 30px 22px 22px; }
      main { padding: 24px 22px 28px; }
      .card { border-radius: 22px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="badge" aria-hidden="true">🍽️ 今日靈感小幫手</div>
      <h1>今天吃什麼？</h1>
      <p class="subtitle">把選擇困難交給抽籤，下一餐就有答案。</p>
    </header>

    <main>
      <label for="options">你的候選清單</label>
      <p class="hint" id="list-hint">每行輸入一個選項；空白行和完全相同的重複選項會自動略過。</p>
      <textarea id="options" aria-describedby="list-hint" spellcheck="false">便當
麵
咖哩
水餃</textarea>
      <button id="draw-button" type="button">幫我選 ✨</button>

      <section class="result" aria-live="polite" aria-atomic="true" aria-label="抽籤結果">
        <div>
          <p class="result-label">今天就決定吃這個！</p>
          <p class="result-value placeholder" id="result">按下按鈕，揭曉你的美食！</p>
        </div>
      </section>
      <p class="sr-only" id="status" role="status"></p>
    </main>
  </div>

  <script>
    const optionsInput = document.querySelector("#options");
    const drawButton = document.querySelector("#draw-button");
    const result = document.querySelector("#result");
    const status = document.querySelector("#status");

    drawButton.addEventListener("click", () => {
      // 只移除空白行與完全相同的重複項目，不改動選項文字本身。
      const options = [...new Set(
        optionsInput.value
          .split(/\r?\n/)
          .filter(option => option.trim() !== "")
      )];

      if (options.length === 0) {
        result.textContent = "請先輸入至少一個選項";
        result.classList.add("placeholder");
        status.textContent = "請先輸入至少一個選項";
        return;
      }

      // 每個去重後的有效選項都以相同機率被選中。
      const choice = options[Math.floor(Math.random() * options.length)];
      result.textContent = choice;
      result.classList.remove("placeholder");
      status.textContent = `抽籤結果：${choice}`;
    });
  </script>
</body>
</html>
